<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>HTTP请求与响应实测</title><style>body{max-width:1200px;margin:25px auto;font:18px "Microsoft YaHei",sans-serif;color:#111}h1{font-size:28px}button{padding:10px 22px;margin-right:12px;font-size:18px}section{margin:22px 0}pre{white-space:pre-wrap;word-break:break-all;font:17px Consolas,"Microsoft YaHei",monospace;line-height:1.5;margin:8px 0}h2{font-size:21px;border-bottom:1px solid #888;padding-bottom:6px}.columns{display:grid;grid-template-columns:1fr 1fr;gap:35px}.note{font-size:15px;color:#555}</style><h1>知行学习网页 HTTP 请求与响应实测</h1><p class="note">本实验自制请求调试页。按钮实际调用本机接口，右侧显示实际收到的状态、响应头和JSON正文；不是浏览器开发者工具面板。</p><button id="get">发送GET资源查询</button><button id="post">发送POST留言</button><p id="status">等待操作</p><div class="columns"><section><h2>请求方法与地址</h2><pre id="request"></pre><h2>脚本设置的请求头与请求体</h2><pre id="payload"></pre></section><section><h2>实际响应状态与响应头</h2><pre id="headers"></pre><h2>实际响应正文</h2><pre id="response"></pre></section></div><script>async function run(method){const url=method==='GET'?'/api/resources?category='+encodeURIComponent('数据库'):'/api/messages';const options={method};if(method==='POST'){options.headers={'Content-Type':'application/json'};options.body=JSON.stringify({name:'黄奕浩',content:'截图验证：本周完成数据库查询与五项前端交互。'});}document.querySelector('#request').textContent=method+' '+location.origin+url;document.querySelector('#payload').textContent=JSON.stringify({headers:options.headers||{},body:options.body?JSON.parse(options.body):null},null,2);const response=await fetch(url,options);document.querySelector('#headers').textContent='状态：'+response.status+' '+response.statusText+'\n'+[...response.headers].map(x=>x[0]+': '+x[1]).join('\n');document.querySelector('#response').textContent=JSON.stringify(await response.json(),null,2);document.querySelector('#status').textContent='已完成真实请求：'+method+'，'+new Date().toLocaleString('zh-CN');}document.querySelector('#get').onclick=()=>run('GET');document.querySelector('#post').onclick=()=>run('POST');</script></html>
