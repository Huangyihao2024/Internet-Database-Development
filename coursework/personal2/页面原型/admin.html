<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>知行后台 · 交互原型</title><link rel="stylesheet" href="style.css"><header><b>知行 / 内容管理</b><a href="index.html">返回前台</a></header><main class="layout"><aside><b>管理导航</b><a href="#">资源管理</a><a href="#">团队信息</a><a href="#">留言审核</a></aside><div><h1>学习资源管理</h1><p class="muted">原型演示，不包含真实登录或数据库</p><section class="panel"><form id="add"><label>资源标题 <input id="title" required maxlength="50"></label><label>分类 <select id="cat"><option>数据库</option><option>前端</option><option>工具</option></select></label><button>新增资源</button></form></section><section class="panel"><table><thead><tr><th>标题</th><th>分类</th><th>状态</th><th>操作</th></tr></thead><tbody id="rows"><tr><td>数据库 SQL 入门</td><td>数据库</td><td>已发布</td><td><button class="delete">删除</button></td></tr></tbody></table><p id="status" role="status"></p></section></div></main><script>document.querySelector('#add').onsubmit=e=>{e.preventDefault();const tr=document.createElement('tr');for(const s of [document.querySelector('#title').value,document.querySelector('#cat').value,'已发布']){const td=document.createElement('td');td.textContent=s;tr.append(td)}const td=document.createElement('td');const b=document.createElement('button');b.className='delete';b.textContent='删除';td.append(b);tr.append(td);document.querySelector('#rows').append(tr);document.querySelector('#status').textContent='资源已加入原型列表';e.target.reset()};document.querySelector('#rows').onclick=e=>{if(e.target.matches('.delete')){e.target.closest('tr').remove();document.querySelector('#status').textContent='资源已从原型列表删除'}};</script></html>
